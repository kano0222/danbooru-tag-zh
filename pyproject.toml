[project]
name = "danbooru-tag-zh"
version = "0.1.0"
description = "Build a traceable Simplified Chinese translation dataset for Danbooru tags"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "opencc>=1.4.2",
]

[project.scripts]
danbooru-tag-zh = "danbooru_tag_zh.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["danbooru_tag_zh"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
