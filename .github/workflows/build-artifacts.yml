name: Update ffdkj translations

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffdkj-publish
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Record published baseline
        id: baseline
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare validated candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          uv run danbooru-tag-zh prepare-ffdkj-update
          if git diff --quiet -- artifacts/ffdkj/zh-hans.min.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check changes
        if: steps.candidate.outputs.changed == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
          git diff --check
      - name: Publish changed files
        if: steps.candidate.outputs.changed == 'true'
        env:
          BASELINE: ${{ steps.baseline.outputs.commit }}
        run: |
          uv run danbooru-tag-zh check-publish-baseline --baseline "$BASELINE" --branch main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- artifacts/ffdkj/zh-hans.min.json artifacts/ffdkj/manifest.json data/sources/ffdkj.lock.json
          git commit -m 'data: update ffdkj translations'
          git push origin HEAD:refs/heads/main
